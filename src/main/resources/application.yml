spring:
  mongodb:
    uri: mongodb+srv://${DB_USER}:${DB_PASSWORD}@cluster0.ilb0w.mongodb.net/myFirstDatabase?retryWrites=true&w=majority
  data:
    mongodb:
      auto-index-creation: true
    rest:
      detection-strategy: annotated
      return-body-on-create: true
      return-body-on-update: true

# Phone verification codes - generated and checked by this backend, see OtpService.
otp:
  # Key for the HMAC the codes are stored under. Any long random string; MUST be set and kept
  # stable (changing it just invalidates codes that are pending at that moment).
  secret: ${OTP_SECRET}
  ttl-minutes: 5
  # Wrong guesses allowed per code before it's thrown away.
  max-attempts: 5
  # Rate limits on requesting a code. Per phone number - wait after the 1st, 2nd, 3rd... code sent
  # in the last 24 hours (60s, 60s, 3 min, 5 min, then 60 min for every further one)...
  resend-cooldowns-seconds: 60,60,180,300,3600
  # ...and per caller IP (generous, since mobile carriers put many users behind one address).
  max-per-ip-per-hour: 30
  # Safety net against SMS-pumping fraud: the most SMS sent in any 24 hours, across all users.
  # Once reached, no more SMS go out until older ones age out of the window.
  sms-daily-limit: ${OTP_SMS_DAILY_LIMIT:500}

smsfly:
  url: ${SMSFLY_API_URL:https://sms-fly.ua/api/v2/api.php}
  # Left empty, no codes can be sent.
  api-key: ${SMSFLY_API_KEY:}
  # Alpha name registered in the SMS-fly account.
  sender: ${SMSFLY_SENDER:}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  # Base64-encoded HS256 secret. MUST be a stable value (override via JWT_SECRET env var in prod).
  # Keeping it stable means issued tokens stay valid across server restarts/redeploys.
  secret: ${JWT_SECRET}
  expiration-days: ${JWT_EXPIRATION_DAYS:30}

taxi:
  ride:
    active:
      minutes: 30
    schedule:
      # How far in advance a ride can be scheduled - see RideService#createRide.
      max-advance-hours: 24
      # Maximum length of a scheduled ride's search window (e.g. 21:00-22:00 = 60 min).
      max-window-minutes: 60
  user:
    code:
      active:
        minutes: 1
    deletion:
      # Days a soft-deleted account (and its rides/chats/messages/ratings) is retained before
      # being permanently purged - see UserService#purgeDeletedAccounts.
      retention-days: 30
