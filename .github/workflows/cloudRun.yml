---
name: Build and Push Java Image to Google Cloud Run
on:
  push:
    branches: [ master ]
jobs:
  build:
    name: Cloud Run Deployment
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: taxiproject
      PROJECT_ID: taxiproject-209815
    steps:

      - name: Checkout
        uses: actions/checkout@master

      - name: Setup GCP Service Account
        uses: google-github-actions/setup-gcloud@v0
        with:
          version: 'latest'
          service_account_email: ${{ vars.ACCOUNT_EMAIL}}
          service_account_key: ${{ secrets.SERVICE_ACCOUNT_KEY }}
          export_default_credentials: true
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker

      - name: Build
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
        run: |
          docker build \
            --build-arg DB_PASSWORD=${DB_PASSWORD} \
            --build-arg DB_USER=${DB_USER} \
            -t gcr.io/$PROJECT_ID/$IMAGE_NAME:latest .

      - name: Push
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:latest

      - name: Deploy
        env:
          DB_URI: ${{ secrets.DB_URI }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          gcloud run deploy taxirun \
          --region us-central1 \
          --image gcr.io/$PROJECT_ID/$IMAGE_NAME \
          --platform managed \
          --allow-unauthenticated \
          --project $PROJECT_ID \
          --set-secrets "/secrets/firebase-adminsdk.json=firebase-adminsdk:latest" \
          --set-env-vars "^@^DB_USER=${DB_USER}@DB_PASSWORD=${DB_PASSWORD}@JWT_SECRET=${JWT_SECRET}@FIREBASE_CREDENTIALS_PATH=/secrets/firebase-adminsdk.json"
